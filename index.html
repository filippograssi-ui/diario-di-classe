<style>
/* Layout: barra filtri in alto, mese a quadretti (o elenco) al centro, schede a scorrimento dal basso per dettagli e moduli. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#18213A; --muted:#58627E; --line:#DCE2EE; --grid:#E6EBF5;
  --blue:#2346C9; --blue-soft:#E4EAFF; --red:#C3302E; --red-soft:#FDE6E4;
  --hl:#FFE066; --hl-ink:#2A2200; --ok:#1E7A4C; --ok-soft:#DFF3E8; --shadow:0 10px 40px rgba(20,30,60,.18);
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-data:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131D; --surface:#171C29; --ink:#E6EAF4; --muted:#9AA4BE; --line:#2A3247; --grid:#1C2232;
  --blue:#8AA4FF; --blue-soft:#1E2850; --red:#FF8078; --red-soft:#3B1C1E;
  --hl:#E6BE2E; --hl-ink:#1D1700; --ok:#5DD39A; --ok-soft:#14301F; --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F131D; --surface:#171C29; --ink:#E6EAF4; --muted:#9AA4BE; --line:#2A3247; --grid:#1C2232;
  --blue:#8AA4FF; --blue-soft:#1E2850; --red:#FF8078; --red-soft:#3B1C1E;
  --hl:#E6BE2E; --hl-ink:#1D1700; --ok:#5DD39A; --ok-soft:#14301F; --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;font-weight:800}
h3{font-size:16px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.classname{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.classname .sub{font-family:var(--f-data);font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:700;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--red)}
.btn .count{background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-family:var(--f-data)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.bar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.bar .field{flex-direction:row;align-items:center;gap:8px}
select,input[type=text],input[type=date],input[type=url],textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}
textarea{resize:vertical;min-height:80px;width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.bar .spacer{flex:1}

.notice{border-radius:10px;padding:10px 14px;font-size:14px;background:var(--blue-soft)}
.notice.warn{background:var(--red-soft)}

/* prossimi per me */

.mine-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.mine-card{flex:0 0 auto;min-width:180px;max-width:240px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:10px 12px;text-align:left}
.mine-card.v{border-left-color:var(--red)}
.mine-card .d{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.mine-card .m{font-weight:700}

/* calendario */
.calhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.calhead h2{min-width:170px;text-transform:capitalize}
.legend{display:flex;gap:6px 14px;font-size:13px;color:var(--muted);margin-left:auto;flex-wrap:wrap;min-width:0}
@media (max-width:640px){.legend{margin-left:0;width:100%}}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.dot.v{background:var(--red)} .dot.i{background:var(--blue)} .dot.me{background:var(--hl)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.dow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;padding:8px;border-bottom:1px solid var(--line);background:var(--surface)}
.day{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;text-align:left;background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/12px 12px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/12px 12px,var(--surface);border-top:0;border-left:0;min-width:0}
.day:nth-child(7n){border-right:0}
.day.out{opacity:.45}
.day.sun{background:var(--bg)}
.day .n{font-family:var(--f-data);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.day.today .n b{background:var(--ink);color:var(--bg);border-radius:99px;padding:0 7px}
.day:hover{outline:2px solid var(--line);outline-offset:-2px}
.chip{display:block;border-radius:6px;padding:3px 6px;font-size:12px;line-height:1.3;min-width:0;overflow:hidden}
.chip.v{background:var(--red-soft);color:var(--red);font-weight:700}
.chip.i{background:var(--blue-soft);color:var(--blue)}
.chip.i b{font-weight:700}
.chip .names{color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:11.5px}
.chip.me{box-shadow:inset 0 0 0 2px var(--hl)}
mark{background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:0 2px}
.dots{display:none;gap:3px;flex-wrap:wrap}
@media (max-width:640px){
  .day{min-height:64px;padding:4px}
  .day .chip{display:none}
  .dots{display:flex}
  .dots i{width:8px;height:8px;border-radius:2px;background:var(--blue)}
  .dots i.v{background:var(--red)}
  .dots i.me{outline:2px solid var(--hl)}
  .dow{padding:6px 2px;text-align:center;letter-spacing:0}
}

/* elenco */
.list{display:flex;flex-direction:column;gap:18px}
.list-day{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px}
@media (max-width:640px){.list-day{grid-template-columns:1fr;gap:6px}}
.list-date{font-family:var(--f-data);font-size:13px;color:var(--muted);padding-top:12px}
.list-date b{display:block;font-family:var(--f-display);font-size:22px;color:var(--ink)}
.list-items{display:flex;flex-direction:column;gap:8px;min-width:0}
.ev{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.ev.v{border-left-color:var(--red)}
.ev:hover{border-color:var(--muted)}
.ev-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;border-radius:99px;padding:2px 9px}
.pill.v{background:var(--red-soft);color:var(--red)} .pill.i{background:var(--blue-soft);color:var(--blue)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.wait{background:var(--hl);color:var(--hl-ink)} .pill.no{background:var(--line);color:var(--muted)}
.ev .subj{font-weight:700;font-size:16px}
.ev .arg{color:var(--muted);font-size:14px}
.ev .who{font-size:14px}
.ev .meta{font-size:12px;color:var(--muted);display:flex;gap:12px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}

/* scheda */
.overlay{position:fixed;inset:0;background:rgba(10,14,25,.45);display:flex;justify-content:center;align-items:flex-end;z-index:50;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:720px){.overlay{align-items:center}}
.sheet{background:var(--surface);width:min(640px,100%);max-height:92%;overflow:auto;border-radius:16px 16px 0 0;box-shadow:var(--shadow);
  padding:20px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:720px){.sheet{border-radius:16px;max-height:88%}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.form{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.checks label{display:flex;gap:8px;align-items:center;font-size:14px;padding:4px 6px;border-radius:6px;min-width:0}
.checks label:hover{background:var(--bg)}
.typepick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.typepick label{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center;font-weight:700}
.typepick label:has(input:checked){border-color:var(--ink);background:var(--bg)}
.section{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.names-list{display:flex;flex-direction:column;gap:4px}
.name-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:var(--bg)}
.note{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.note .t{font-weight:700}
.note .txt{white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere}
.note img{border-radius:8px;max-height:260px;object-fit:contain;align-self:flex-start;border:1px solid var(--line)}
.note a{color:var(--blue);overflow-wrap:anywhere}
.note .by{font-size:12px;color:var(--muted)}
.swap{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.swap .pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;font-size:14px}
.swap .arrow{font-family:var(--f-data);color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:80;max-width:calc(100% - 32px)}
.err{color:var(--red);font-size:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="classname">
      <h1 id="title">Diario di Classe</h1>
      <span class="sub" id="classSub">verifiche · interrogazioni · appunti</span>
    </div>
    <div class="actions">
      <button class="btn" id="btnSwaps" type="button">Scambi <span class="count" id="swapCount" hidden>0</span></button>
      <button class="btn" id="btnClass" type="button">Classe</button>
      <button class="btn primary" id="btnAdd" type="button">+ Aggiungi</button>
    </div>
  </header>

  <div id="notices"></div>

  <div class="bar">
    <div class="field"><label class="label" for="me">Io sono</label>
      <select id="me"><option value="">— scegli il tuo nome —</option></select></div>
    <div class="field"><label class="label" for="filter">Mostra</label>
      <select id="filter"><option value="__all">Tutta la classe</option><option value="__me">Solo io</option></select></div>
    <div class="field"><label class="label" for="subject">Materia</label>
      <select id="subject"><option value="">Tutte</option></select></div>
    <span class="spacer"></span>
    <div class="seg" role="group" aria-label="Vista">
      <button type="button" id="vMonth" aria-pressed="true">Mese</button>
      <button type="button" id="vList" aria-pressed="false">Elenco</button>
    </div>
  </div>

  <section class="mine" id="mine" hidden>
    <span class="label" id="mineLabel">In arrivo per te</span>
    <div class="mine-row" id="mineRow"></div>
  </section>

  <section id="monthView">
    <div class="calhead">
      <button class="btn small" id="prev" type="button" aria-label="Mese precedente">‹</button>
      <h2 id="monthName">…</h2>
      <button class="btn small" id="next" type="button" aria-label="Mese successivo">›</button>
      <button class="btn small ghost" id="today" type="button">Oggi</button>
      <div class="legend"><span><i class="dot v"></i>Verifica</span><span><i class="dot i"></i>Interrogazione</span><span><i class="dot me"></i>Ci sei tu</span></div>
    </div>
    <div style="height:10px"></div>
    <div class="cal" id="cal"></div>
  </section>

  <section id="listView" hidden>
    <div class="calhead" style="margin-bottom:12px">
      <h2>Prossimi giorni</h2>
      <label class="muted" style="display:flex;gap:6px;align-items:center;font-size:14px;margin-left:auto"><input type="checkbox" id="showPast"> mostra anche i giorni passati</label>
    </div>
    <div class="list" id="list"></div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>window.DIARIO_CONFIG = { url: "https://rfphgyphgxtmdzahzqtu.supabase.co", key: "sb_publishable_Ibw7Jmbyu2eD3RNRhLxsEQ_Wu4bjXTq" };</script>
<script src="backend.js"></script>
<script>
(() => {
const SUBJECTS = ["Italiano","Latino","Inglese","Storia","Filosofia","Matematica","Fisica","Scienze","Biologia","Chimica","Arte","Informatica","Scienze motorie","Religione"];
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const DOW = ["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];

const S = { db:null, assets:null, canWrite:null, ready:false,
  classe:{nome:"", studenti:[]}, eventi:[], appunti:[], scambi:[], turni:[],
  me:"", filter:"__all", subject:"", view:"month", cursor:new Date(), showPast:false,
  sheet:null };

// ---------- utilità ----------
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v==null || v===false) continue;
    if (k==="class") el.className=v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k==="text") el.textContent=v;
    else el.setAttribute(k, v===true?"":v);
  }
  for (const k of kids.flat()){ if (k==null||k===false) continue; el.append(k instanceof Node?k:document.createTextNode(String(k))); }
  return el;
}
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayIso = () => iso(new Date());
const parseIso = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const fmtDay = s => { const d=parseIso(s); return d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"}); };
const fmtShort = s => { const d=parseIso(s); return d.toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"}); };
const store = { get(k){ try{return localStorage.getItem(k)||"";}catch{return "";} }, set(k,v){ try{localStorage.setItem(k,v);}catch{} } };
function toast(msg){ const t=h("div",{class:"toast",role:"status",text:msg}); document.body.append(t); setTimeout(()=>t.remove(),2600); }
const safeUrl = u => { try{ const x=new URL(u); return /^https?:$/.test(x.protocol)?x.href:null; }catch{ return null; } };
const sortNames = a => [...a].sort((x,y)=>x.localeCompare(y,"it"));
const evById = id => S.eventi.find(e=>e.id===id);
const isI = e => e.tipo==="interrogazione";
const turnoOf = e => e && e.turnoId ? S.turni.find(t=>t.id===e.turnoId) || null : null;
const argOf = e => { const t=turnoOf(e); return t ? (t.argomenti||"") : (e.argomenti||""); };
const notesFor = e => S.appunti.filter(a => e.turnoId ? a.turnoId===e.turnoId : (a.eventoId===e.id && !a.turnoId));
const daysOf = t => sorted(S.eventi.filter(e=>e.turnoId===t.id));
const sortedTurni = () => [...S.turni].sort((a,b)=>(a.materia||"").localeCompare(b.materia||"","it") || (a.creato||0)-(b.creato||0));
const who = () => S.filter==="__me" ? S.me : (S.filter==="__all" ? "" : S.filter);

function visible(e){
  if (S.subject && e.materia!==S.subject) return false;
  const p = who();
  if (S.filter==="__me" && !S.me) return true;
  if (p && isI(e) && !(e.studenti||[]).includes(p)) return false;
  return true;
}
function includesMe(e){ return S.me && (e.tipo==="verifica" || (e.studenti||[]).includes(S.me)); }
function nameNode(n){ return n===S.me ? h("mark",null,n) : document.createTextNode(n); }
function namesNodes(arr){ const out=[]; sortNames(arr).forEach((n,i)=>{ if(i) out.push(", "); out.push(nameNode(n)); }); return out; }
const writable = () => S.db && S.canWrite!==false;

async function guard(fn){
  try { await fn(); return true; }
  catch(e){
    const c = e && e.code;
    if (c==="invalid_argument"){ S.canWrite=false; renderNotices(); toast("Non hai il permesso di modificare: chiedi a chi ha creato la pagina di aggiungerti come Editor."); }
    else if (c==="quota_exceeded") toast("Spazio esaurito: cancella qualche appunto vecchio e riprova.");
    else toast("Non sono riuscito a salvare. Controlla la connessione e riprova.");
    console.warn(e); return false;
  }
}

// ---------- avvio ----------
S.me = store.get("diario.me");
S.view = store.get("diario.view")==="list" ? "list" : "month";
render();
window.__diarioOffline = f => { if (S.offline!==f){ S.offline=f; renderNotices(); } };

(async () => {
  const backend = window.__makeBackend ? window.__makeBackend() : null;
  S.db = backend && backend.db; S.assets = backend && backend.assets; S.canWrite = null;
  S.ready = true;
  if (!S.db){ renderNotices(); render(); return; }
  const db = S.db;
  const onErr = e => { console.warn(e); };
  db.doc("classe/info").onSnapshot(s => { const d=s.exists?s.data():{}; S.classe={nome:d.nome||"", studenti:Array.isArray(d.studenti)?d.studenti:[]}; render(); }, onErr);
  db.collection("eventi").onSnapshot(s => { S.eventi=s.docs.map(d=>({id:d.id,...d.data()})); render(); }, onErr);

  sel.value = value; if (sel.value!==value) sel.value = keep[0]?keep[0].value:"";

function render(){

  document.title = S.classe.nome ? "Diario " + S.classe.nome : "Diario di Classe";
  const nomi = sortNames(S.classe.studenti);
  // io sono
  const meSel=$("#me"); meSel.querySelector("option").dataset.fixed="1";
  const meOpts = nomi.map(n=>[n,n]); if (S.me && !nomi.includes(S.me)) meOpts.unshift([S.me,S.me]);
  fillSelect(meSel, meOpts, S.me);

  const sSel=$("#subject"); sSel.querySelector("option").dataset.fixed="1";

// ---------- appunti ----------
function openNoteForm(eventoId){
  const e=evById(eventoId); if(!e) return;
  openSheet(()=>{
    const form=h("form",{class:"form",onsubmit:async ev=>{
      ev.preventDefault(); const fd=new FormData(form); const errEl=form.querySelector(".err"); errEl.textContent="";
      if(!S.me){ errEl.textContent="Scegli prima il tuo nome in «Io sono», così gli altri sanno chi ha caricato gli appunti."; return; }
      const titolo=String(fd.get("titolo")||"").trim(), testo=String(fd.get("testo")||"").trim(), linkRaw=String(fd.get("link")||"").trim();
      const file=form.querySelector("#nFile").files[0];
      let link=""; if(linkRaw){ link=safeUrl(linkRaw)||""; if(!link){ errEl.textContent="Il link deve iniziare con https://"; return; } }
      if(!testo && !link && !file){ errEl.textContent="Scrivi del testo, incolla un link o allega un file."; return; }
      const btn=form.querySelector("button[type=submit]"); btn.disabled=true; btn.textContent="Caricamento…";
      const doc={ eventoId, titolo:titolo||(file?file.name:"Appunti"), testo, link, autore:S.me, creato:Date.now() };
      if(e.turnoId) doc.turnoId=e.turnoId;
      if(file){
        if(!S.assets){ errEl.textContent="Da questo account non puoi caricare file: usa testo o un link (es. Google Drive)."; btn.disabled=false; btn.textContent="Pubblica"; return; }
        try{
          const r=await S.assets.upload(file, typeFor(file) ? {type:typeFor(file)} : undefined);
          doc.fileId=r.id; doc.fileNome=file.name; doc.fileTipo=r.contentType;
        }catch(err){
          const m={too_large:"Il file è troppo grande (massimo 20 MB).",unsupported_type:"Formato non supportato: usa PDF, JPG, PNG, WEBP o TXT.",quota_or_state:"Lo spazio per i file è pieno.",rate_limited:"Troppi caricamenti di fila: riprova tra poco."}[err&&err.code];
          errEl.textContent=m||"Caricamento non riuscito, riprova."; btn.disabled=false; btn.textContent="Pubblica"; return;
        }
      }
      if(await guard(()=>S.db.collection("appunti").add(doc))){ toast("Appunti pubblicati"); openEvent(eventoId); }
      else { btn.disabled=false; btn.textContent="Pubblica"; }
    }},
      head("Carica appunti", (e.materia||"")+" · "+(turnoOf(e)?turnoOf(e).titolo+" (visibili in tutti i giorni del turno)":fmtShort(e.data))),
      h("div",{class:"field"},h("label",{class:"label",for:"nTit"},"Titolo"),h("input",{type:"text",id:"nTit",name:"titolo",placeholder:"Es. Schema cap. 5"})),
      h("div",{class:"field"},h("label",{class:"label",for:"nTxt"},"Testo"),h("textarea",{id:"nTxt",name:"testo",placeholder:"Riassunto, domande probabili, cosa ha detto il prof…"})),
      h("div",{class:"field"},h("label",{class:"label",for:"nFile"},"File (PDF o foto)"),h("input",{type:"file",id:"nFile",accept:"application/pdf,image/*,.txt,.md"}),
        S.assets?null:h("span",{class:"muted",style:"font-size:13px"},"Con il tuo accesso non puoi caricare file: usa testo o link.")),
      h("div",{class:"field"},h("label",{class:"label",for:"nLink"},"Link"),h("input",{type:"url",id:"nLink",name:"link",placeholder:"https://drive.google.com/…"})),
      h("div",{class:"err",role:"alert"}),
      h("div",{class:"actions"},h("button",{class:"btn primary",type:"submit"},"Pubblica"),h("button",{class:"btn",type:"button",onclick:()=>openEvent(eventoId)},"Annulla")));
    return form;
  }, false);
}
function typeFor(f){
  const ok=["image/png","image/jpeg","image/gif","image/webp","application/pdf","text/plain","text/markdown"];
  if(ok.includes(f.type)) return null;
  const ext=(f.name.split(".").pop()||"").toLowerCase();
  return {pdf:"application/pdf",jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",webp:"image/webp",gif:"image/gif",txt:"text/plain",md:"text/markdown"}[ext]||null;
}

// ---------- scambi ----------
function swapOptions(){
  const t=todayIso();
  const mine=sorted(S.eventi.filter(e=>isI(e)&&e.data>=t&&(e.studenti||[]).includes(S.me)));
  const others=[];
  for(const e of sorted(S.eventi.filter(e=>isI(e)&&e.data>=t)))
    for(const n of sortNames(e.studenti||[])) if(n!==S.me && !(e.studenti||[]).includes(S.me)) others.push({e,n});
  return {mine,others};
}
function openSwapForm(pre){
  if(!S.me){ toast("Scegli prima il tuo nome in «Io sono»."); return; }
  openSheet(()=>{
    const {mine,others}=swapOptions();
    if(!mine.length) return h("div",{class:"form"},head("Proponi uno scambio"),h("div",{class:"muted"},"Non hai interrogazioni in programma da scambiare."));
    let daEv = pre.daEvento || (pre.aEvento ? (mine.find(m=>m.materia===(evById(pre.aEvento)||{}).materia)||mine[0]).id : mine[0].id);
    const form=h("form",{class:"form",onsubmit:async ev=>{
      ev.preventDefault();
      const da=form.querySelector("#sDa").value, [aEv,aNome]=form.querySelector("#sA").value.split("|");
      if(!aEv){ form.querySelector(".err").textContent="Scegli con chi vuoi scambiare."; return; }
      const doc={daNome:S.me,daEvento:da,aNome,aEvento:aEv,nota:form.querySelector("#sNota").value.trim(),stato:"in attesa",creato:Date.now()};
      if(await guard(()=>S.db.collection("scambi").add(doc))){ toast("Richiesta inviata a "+aNome); openSwaps(); }
    }},
      head("Proponi uno scambio","Vi scambiate il giorno: la persona deve accettare."),
      h("div",{class:"field"},h("label",{class:"label",for:"sDa"},"Il mio posto"),
        h("select",{id:"sDa"},mine.map(e=>h("option",{value:e.id,selected:e.id===daEv},(e.materia||"")+" · "+fmtShort(e.data))))),
      h("div",{class:"field"},h("label",{class:"label",for:"sA"},"Con"),h("select",{id:"sA"})),
      h("label",{class:"muted",style:"display:flex;gap:6px;align-items:center;font-size:14px"},h("input",{type:"checkbox",id:"sSame",checked:true}),"solo lo stesso turno"),
      h("div",{class:"field"},h("label",{class:"label",for:"sNota"},"Messaggio (facoltativo)"),h("input",{type:"text",id:"sNota",placeholder:"Es. quel giorno ho anche la verifica di fisica"})),
      h("div",{class:"err",role:"alert"}),
      h("div",{class:"actions"},h("button",{class:"btn primary",type:"submit"},"Invia richiesta"),h("button",{class:"btn",type:"button",onclick:closeSheet},"Annulla")));
    const fillA=()=>{
      const da=evById(form.querySelector("#sDa").value); const same=form.querySelector("#sSame").checked;
      const list=others.filter(o=>!same||(da.turnoId ? o.e.turnoId===da.turnoId : o.e.materia===da.materia));
      const selA=form.querySelector("#sA"); const want=pre.aEvento?pre.aEvento+"|"+pre.aNome:selA.value;
      selA.replaceChildren(list.length?null:h("option",{value:""},"Nessuno disponibile"),
        ...list.map(o=>h("option",{value:o.e.id+"|"+o.n},o.n+" — "+(o.e.materia||"")+" · "+fmtShort(o.e.data))));
      if(list.some(o=>o.e.id+"|"+o.n===want)) selA.value=want;
    };
    form.querySelector("#sDa").addEventListener("change",()=>{pre={};fillA();});
    form.querySelector("#sSame").addEventListener("change",fillA);
    fillA();
    return form;
  }, false);
}

async function acceptSwap(x){
  const a=evById(x.daEvento), b=evById(x.aEvento);
  const valid=a&&b&&(a.studenti||[]).includes(x.daNome)&&(b.studenti||[]).includes(x.aNome)&&!(a.studenti||[]).includes(x.aNome)&&!(b.studenti||[]).includes(x.daNome);
  if(!valid){ await guard(()=>S.db.doc("scambi/"+x.id).update({stato:"non valido",risolto:Date.now()})); toast("Lo scambio non è più possibile: le date sono cambiate."); return; }
  const na=(a.studenti||[]).map(n=>n===x.daNome?x.aNome:n), nb=(b.studenti||[]).map(n=>n===x.aNome?x.daNome:n);
  if(!await guard(()=>S.db.doc("eventi/"+a.id).update({studenti:na}))) return;
  if(!await guard(()=>S.db.doc("eventi/"+b.id).update({studenti:nb}))) return;
  await guard(()=>S.db.doc("scambi/"+x.id).update({stato:"accettato",risolto:Date.now()}));
  toast("Scambio fatto: ora vai il "+fmtShort(a.data));
}
const setSwap=(x,stato)=>guard(()=>S.db.doc("scambi/"+x.id).update({stato,risolto:Date.now()}));

function swapCard(x, actions){
  const a=evById(x.daEvento), b=evById(x.aEvento);
  const lab=e=>e?(e.materia||"")+" · "+fmtShort(e.data):"data eliminata";
  const pill={"in attesa":["wait","In attesa"],"accettato":["ok","Accettato"],"rifiutato":["no","Rifiutato"],"annullato":["no","Annullato"],"non valido":["no","Non più valido"]}[x.stato]||["no",x.stato];
  return h("div",{class:"swap"},
    h("div",{class:"ev-top"},h("span",{class:"pill "+pill[0]},pill[1]),h("span",{class:"muted",style:"font-size:13px"},x.creato?new Date(x.creato).toLocaleDateString("it-IT",{day:"numeric",month:"short"}):"")),
    h("div",{class:"pair"},h("div",null,h("b",null,nameNode(x.daNome)),h("div",{class:"muted"},lab(a))),h("span",{class:"arrow"},"⇄"),h("div",null,h("b",null,nameNode(x.aNome)),h("div",{class:"muted"},lab(b)))),
    x.nota?h("div",{style:"font-size:14px"},"“"+x.nota+"”"):null,
    actions&&actions.length?h("div",{class:"actions"},actions):null);
}

function openSwaps(){
  openSheet(()=>{
    const all=[...S.scambi].sort((a,b)=>(b.creato||0)-(a.creato||0));
    const incoming=all.filter(x=>x.stato==="in attesa"&&x.aNome===S.me);
    const outgoing=all.filter(x=>x.stato==="in attesa"&&x.daNome===S.me);
    const rest=all.filter(x=>!incoming.includes(x)&&!outgoing.includes(x)).slice(0,30);
    const w=writable();
    return h("div",{class:"form"},
      head("Scambi", S.me?"Scambiate il giorno dell'interrogazione: chi riceve la richiesta accetta o rifiuta.":"Scegli il tuo nome in «Io sono» per vedere le richieste per te."),
      w&&S.me?h("div",{class:"actions"},h("button",{class:"btn primary",type:"button",onclick:()=>openSwapForm({})},"Proponi uno scambio")):null,
      S.me?h("div",{class:"section"},h("span",{class:"label"},"Richieste per te ("+incoming.length+")"),
        incoming.length?incoming.map(x=>swapCard(x,w?[h("button",{class:"btn small primary",type:"button",onclick:()=>acceptSwap(x)},"Accetta"),h("button",{class:"btn small",type:"button",onclick:()=>setSwap(x,"rifiutato")},"Rifiuta")]:[])):h("div",{class:"muted"},"Nessuna richiesta.")):null,
      S.me&&outgoing.length?h("div",{class:"section"},h("span",{class:"label"},"Le tue richieste"),outgoing.map(x=>swapCard(x,w?[h("button",{class:"btn small",type:"button",onclick:()=>setSwap(x,"annullato")},"Annulla richiesta")]:[]))):null,
      h("div",{class:"section"},h("span",{class:"label"},"Storico della classe"),rest.length?rest.map(x=>swapCard(x)):h("div",{class:"muted"},"Ancora nessuno scambio.")));
  }, true);
}
